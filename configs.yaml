#initiating seed for fixing randomness pattern
#initial folder for saving results
#initial config version
random_seed: 10
output_folder: "output"
generator_version: "1.0"
#normal events
normal_events:
  count: 10000
  user_id_range: [1000,5000]
  product_id_range: [1,200]
  
  rating_distribution: 
    1: 0.1
    2: 0.1
    3: 0.2
    4: 0.3
    5: 0.3
  timestamp_range:
    start: "2025-01-01T00:00:00"
    end: "2025-10-01T23:59:59"

#fraud events
fraud_events: 
  count: 25
  fraud_user_ids: [5001,5005]
  timestamp_range: 
    start: "2025-08-02T02:00:00"
    end: "2025-08-02T03:00:00"
  attackers_strategies:
  #boosting strategy:
    allies_boost :
      target_product: [10]
      rating_product: 5
      weight: 0.55
  #worsen strategy:
    competitors_nerf :
      target_product: [123]
      rating_product: 1
      weight: 0.45